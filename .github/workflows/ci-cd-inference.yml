name: CI/CD Inference Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  IMAGE_NAME: auto-transport-inference

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Yandex Container Registry
      uses: docker/login-action@v3
      with:
        registry: cr.yandex
        username: json_key
        password: ${{ secrets.YC_SA_JSON_KEY_INFERENCE }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile.inference
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

    - name: Test connection to Yandex Cloud
      run: |
        echo "${{ secrets.YC_SA_JSON_KEY_INFERENCE }}" > key.json
        yc config set service-account-key key.json
        yc storage bucket list

  update-model:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Download latest model
      env:
        YC_SA_ACCESS_KEY: ${{ secrets.YC_SA_ACCESS_KEY_INFERENCE }}
        YC_SA_SECRET_KEY: ${{ secrets.YC_SA_SECRET_KEY_INFERENCE }}
      run: |
        python scripts/download_model.py --latest